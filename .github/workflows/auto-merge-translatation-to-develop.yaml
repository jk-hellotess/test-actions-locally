name: Auto Merge for Translation Branch

on:
  push:
    branches:
      - "translation"

jobs:
  auto-merge-into-develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.TRANSLATION_MERGE_BOT_APP_ID }}
          private-key: ${{ secrets.TRANSLATION_MERGE_BOT_APP_PRIVATE_KEY }}
      - name: Checkout Develop Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ steps.app-token.outputs.token }}
          # persist-credentials: false

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      
      - run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Fetch Translation Branch
        run: |
          git fetch origin translation

      - name: Merge Translation into Develop
        run: |
          git pull origin develop-test
          git merge origin/translation --no-ff --commit --message "Auto-merge translation into develop"
        
      - name: Push Changes to Develop
        run: |
          git push origin develop-test

